function weighted(scores, dims) {
  let t = 0, w = 0;
  dims.forEach(d => { t += scores[d.id] * d.weight; w += d.weight; });
  return Math.round(t / w);
}

// 生成规则指纹：对维度内容做简单哈希，规则一旦改变指纹随之改变
function ruleFingerprint(dims) {
  const str = JSON.stringify(dims.map(d => ({ id: d.id, weight: d.weight })));
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(16).toUpperCase().padStart(8, "0");
}

            </button>
            <div className="flex items-center gap-2 text-xs text-gray-300">
              <svg className="w-3.5 h-3.5 text-blue-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              所有投递候选人将收到规则快照邮件，含本指纹
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={() => {
              setLocked(false); setFP(""); setLocAt(""); setEx(false);
              setSelectedJob(null); setShowJd(false); setDims(DIMS_DEFAULT);
              onReset();
            }}
              className="flex-1 py-2.5 bg-white/10 hover:bg-white/20 text-white text-sm rounded-lg transition-colors">
              重新设置规则
            </button>
            <button onClick={onGoToScreen}
              className="flex-1 py-2.5 bg-blue-500 hover:bg-blue-400 text-white text-sm font-semibold rounded-lg transition-colors flex items-center justify-center gap-2">
              前往筛选工作台
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Page 2: Screening Dashboard ─────────────────────────────────────────────

function ScreeningDashboard({ dims, selectedJob, pool, addToPool, overrides, setOverrides }) {
  const activeDims = dims || DIMS_DEFAULT;
  const jobCandidates = selectedJob ? CANDIDATES.filter(c => c.job === selectedJob) : CANDIDATES;
  const [selected, setSelected]       = useState([]);
  const [results, setResults]         = useState(null);
  const [loading, setLoading]         = useState(false);
  const [expanded, setExpanded]       = useState(null);
  const [notes, setNotes]             = useState({});
  const [resumeCandidate, setResume]  = useState(null);

  function run() {
    setLoading(true); setResults(null);
    setTimeout(() => { setResults(jobCandidates.filter(c => selected.includes(c.id))); setLoading(false); }, 1400);
  }

  function overrideColor(r) {
    return r === "强推进面试" ? "green" : r === "不推进" ? "red" : "yellow";
  }

  return (
    <div className="max-w-2xl mx-auto space-y-5 fade-in">
      <div>
        <h2 className="text-xl font-bold text-gray-800">筛选工作台</h2>
        <p className="text-sm text-gray-500 mt-1">选择简历，AI 按锁定规则逐条评分并给出理由</p>
      </div>

      {/* Selector */}
      <div className="bg-white rounded-xl border border-gray-200 p-4 space-y-3">
        <div className="flex items-center justify-between">
          <div>
            <span className="text-sm font-medium text-gray-700">选择待筛简历</span>
            {selectedJob && <span className="ml-2 text-xs text-gray-400">{JOB_PRESETS[selectedJob]?.label}</span>}
          </div>
          <button onClick={() => setSelected(selected.length === jobCandidates.length ? [] : jobCandidates.map(c => c.id))}
            className="text-xs text-blue-600 hover:underline">
            {selected.length === jobCandidates.length ? "取消全选" : "全选"}
          </button>
        </div>
        <div className="grid grid-cols-2 gap-2">
          {jobCandidates.map(c => (
            <label key={c.id} className={`flex items-center gap-3 p-3 rounded-lg border cursor-pointer transition-colors ${selected.includes(c.id) ? "border-blue-400 bg-blue-50" : "border-gray-200 hover:bg-gray-50"}`}>
              <input type="checkbox" checked={selected.includes(c.id)}
                onChange={() => setSelected(s => s.includes(c.id) ? s.filter(x => x !== c.id) : [...s, c.id])}
                className="accent-blue-500" />
              <div>
                <div className="text-sm font-medium text-gray-800">{c.name}</div>
                <div className="text-xs text-gray-500">{c.school} · {c.tag}</div>
              </div>
            </label>
          ))}
        </div>
        <button disabled={selected.length === 0 || loading} onClick={run}
          className="mt-1 px-5 py-2.5 bg-blue-600 text-white text-sm rounded-lg disabled:opacity-40 hover:bg-blue-700 transition-colors flex items-center gap-2">
          {loading
            ? <><svg className="w-4 h-4 spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>AI 评分中…</>
            : "开始筛选"}
        </button>
      </div>

      <ResumeModal candidate={resumeCandidate} onClose={() => setResume(null)} />

      {/* Summary bar */}
      {results && (() => {
        const total = results.length;
        const strong = results.filter(c => (overrides[c.id] || c.result) === "强推进面试").length;
        const pending = results.filter(c => (overrides[c.id] || c.result) === "待定").length;
        const reject = results.filter(c => (overrides[c.id] || c.result) === "不推进").length;
        const autoRate = Math.round(((strong + reject) / total) * 100);
        return (
          <div className="bg-white rounded-xl border border-gray-200 px-4 py-3 flex items-center gap-6 flex-wrap fade-in">
            <span className="text-xs font-medium text-gray-500">本次筛选汇总</span>
            <span className="text-sm font-bold text-emerald-600">{strong} 强推进</span>
            <span className="text-sm font-bold text-amber-500">{pending} 待定</span>
            <span className="text-sm font-bold text-red-500">{reject} 不推进</span>
            <span className="ml-auto text-xs text-gray-400">AI 自动处理率 <span className="font-semibold text-gray-700">{autoRate}%</span></span>
          </div>
        );
      })()}

      {/* Results */}
      {results && results.map(c => {
        const finalResult = overrides[c.id] || c.result;
        const finalColor  = overrides[c.id] ? overrideColor(overrides[c.id]) : c.color;
        const s = STYLE[finalColor];
        const score = weighted(c.scores, activeDims);
        const open = expanded === c.id;

        return (
          <div key={c.id} className={`rounded-xl border ${s.border} ${s.bg} overflow-hidden fade-in`}>
            <div className="p-4">
              <div className="flex items-start justify-between gap-4">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-bold text-gray-900">{c.name}</span>
                    <span className="text-xs bg-white border border-gray-200 text-gray-600 px-2 py-0.5 rounded-full">{c.school}</span>
                    <span className={`text-xs px-2 py-0.5 rounded-full ${TAG_STYLE[c.tag]}`}>{c.tag}</span>
                  </div>
                  <p className="text-xs text-gray-500 mt-1 leading-relaxed">{c.summary}</p>
                </div>
                <div className="text-right shrink-0">
                  <span className={`text-xs font-semibold px-3 py-1 rounded-full ${s.badge}`}>{finalResult}</span>
                  <div className="text-2xl font-bold text-gray-800 mt-1">{score}<span className="text-sm font-normal text-gray-400"> 分</span></div>
                </div>
              </div>

              <div className="mt-3 space-y-1.5">
                {activeDims.map(d => (
                  <div key={d.id} className="grid items-center gap-2" style={{gridTemplateColumns: "8rem 1fr"}}>
                    <span className="text-xs text-gray-500 truncate">{d.label}（{d.weight}%）</span>
                    <Bar value={c.scores[d.id]} />
                  </div>
                ))}
              </div>

              <div className="mt-3 flex items-center gap-4 flex-wrap">
                <button onClick={() => setExpanded(open ? null : c.id)}
                  className="text-xs text-blue-600 hover:underline">
                  {open ? "收起详细理由 ▲" : "展开详细理由 ▼"}
                </button>
                <button onClick={() => setResume(c)}
                  className="text-xs text-gray-400 hover:text-gray-700 flex items-center gap-1 transition-colors">
                  <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                  查看原始简历
                </button>
                {finalResult === "不推进" && addToPool && (
                  pool && pool.find(p => p.id === c.id)
                    ? <span className="text-xs text-amber-600 flex items-center gap-1">
                        <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7"/></svg>
                        已加入备选池
                      </span>
                    : <button onClick={() => addToPool(c)}
                        className="text-xs text-amber-600 hover:text-amber-800 flex items-center gap-1 transition-colors border border-amber-200 rounded px-2 py-0.5 hover:bg-amber-50">
                        <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4"/></svg>
                        加入备选池
                      </button>
                )}
              </div>
            </div>

            {open && (
              <div className="border-t border-dashed border-gray-200 bg-white/60 p-4 space-y-3 fade-in">
                <p className="text-xs font-medium text-gray-500 uppercase tracking-wide">AI 评分理由（按维度）</p>
                {activeDims.map(d => (
                  <div key={d.id} className="flex gap-3">
                    <span className="text-xs font-semibold text-gray-700 w-20 shrink-0 pt-0.5">{d.label}</span>
                    <p className="text-xs text-gray-600 leading-relaxed">{c.reasons[d.id]}</p>
                  </div>
                ))}
                <div className="pt-2 border-t border-gray-100 space-y-2">
                  <p className="text-xs font-medium text-gray-600">HR 覆盖 AI 建议</p>
                  <div className="flex gap-2 flex-wrap">
                    {["强推进面试", "待定", "不推进"].map(r => (
                      <button key={r} onClick={() => setOverrides(o => ({...o, [c.id]: r}))}
                        className={`text-xs px-3 py-1.5 rounded-lg border transition-colors ${overrides[c.id] === r ? "bg-gray-900 text-white border-gray-900" : "bg-white text-gray-600 border-gray-200 hover:border-gray-400"}`}>
                        {r}
                      </button>
                    ))}
                  </div>
                  <input
                    className="w-full text-xs border border-gray-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300"
                    placeholder="覆盖原因（必填，将留存记录）…"
                    value={notes[c.id] || ""}
                    onChange={e => setNotes(n => ({...n, [c.id]: e.target.value}))}
                  />
                  {overrides[c.id] && <p className="text-xs text-amber-600">⚠ HR 已覆盖 AI 建议，覆盖记录已留存。</p>}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── Page 3: Candidate View ───────────────────────────────────────────────────

function CandidateView({ dims, fingerprint, openPublicPage, overrides = {} }) {
  const activeDims = dims || DIMS_DEFAULT;
  const [sel, setSel]           = useState("B");
  const [appealOpen, setAO]     = useState(false);
  const [appealText, setAT]     = useState("");
  const [submitted, setSubmit]  = useState(false);

  const c = CANDIDATES.find(x => x.id === sel);
  // HR 覆盖优先，否则用 AI 原始结果
  const finalResult = overrides[c.id] || c.result;
  const overrideColorMap = { "强推进面试": "green", "待定": "yellow", "不推进": "red" };
  const finalColor  = overrides[c.id] ? overrideColorMap[overrides[c.id]] : c.color;
  const s = STYLE[finalColor];
  // 用候选人自己岗位的维度展示评估结果，避免跨岗位维度 ID 对不上
  const displayDims = JOB_PRESETS[c.job]?.dims || activeDims;

  return (
    <div className="max-w-lg mx-auto space-y-5 fade-in">
      <div>
        <h2 className="text-xl font-bold text-gray-800">候选人视图</h2>
        <p className="text-sm text-gray-500 mt-1">候选人登录后看到的页面（模拟）</p>
      </div>

      {/* Switcher - grouped by job */}
      <div className="space-y-2">
        {[{job: "pm", label: "产品经理岗"}, {job: "dev", label: "后端开发岗"}].map(group => (
          <div key={group.job}>
            <p className="text-xs text-gray-400 mb-1.5">{group.label}</p>
            <div className="flex gap-2 flex-wrap">
              {CANDIDATES.filter(cd => cd.job === group.job).map(cd => (
                <button key={cd.id} onClick={() => { setSel(cd.id); setAO(false); setSubmit(false); setAT(""); }}
                  className={`text-sm px-3 py-1.5 rounded-lg border transition-colors ${sel === cd.id ? "bg-gray-900 text-white border-gray-900" : "bg-white text-gray-600 border-gray-200 hover:border-gray-400"}`}>
                  {cd.name}
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div className={`rounded-2xl border-2 ${s.border} overflow-hidden`}>
        {/* Banner */}
        <div className={`${s.bg} px-5 py-4 flex items-center justify-between`}>
          <div>
            <p className="text-xs text-gray-500 mb-0.5">腾讯 · {c.job === "dev" ? "后端开发实习生" : "产品经理实习生"} · 2026届秋招</p>
            <h3 className="text-lg font-bold text-gray-900">您好，{c.name}</h3>
          </div>
          <div className="text-right">
            <span className={`text-sm font-bold px-4 py-2 rounded-full ${s.badge}`}>{finalResult}</span>
            {overrides[c.id] && <p className="text-xs text-amber-600 mt-1">HR 已调整</p>}
          </div>
        </div>

        <div className="bg-white px-5 py-4 space-y-4">
          {/* Dimension results */}
          <div>
            <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-3">评估维度结果</p>
            <div className="space-y-3">
              {displayDims.map(d => {
                const pass = c.scores[d.id] >= 65;
                return (
                  <div key={d.id} className="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
                    <div>
                      <span className="text-sm font-medium text-gray-800">{d.label}</span>
                      <span className="text-xs text-gray-400 ml-2">权重 {d.weight}%</span>
                    </div>
                    <span className={`text-xs font-semibold px-2 py-1 rounded-full ${pass ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-600"}`}>
                      {pass ? "符合要求" : "有待提升"}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Rule fingerprint for candidate */}
          <div className="border border-gray-100 rounded-lg px-3 py-2.5 space-y-1.5">
            <div className="flex items-center justify-between">
              <span className="text-xs font-medium text-gray-600">本次评估适用规则版本</span>
              <button onClick={openPublicPage}
                className="text-xs text-blue-500 hover:underline">查看公示页 ↗</button>
            </div>
            <div className="flex items-center gap-2">
              <span className="font-mono text-xs text-gray-800 bg-gray-100 px-2 py-0.5 rounded tracking-widest">
                {fingerprint || ruleFingerprint(activeDims)}
              </span>
              <span className="text-xs text-gray-400">投递时已发送至您的邮箱</span>
            </div>
            <p className="text-xs text-gray-400">如指纹与邮件中一致，说明规则在您投递后未被修改。</p>
          </div>

          {/* Note */}
          <div className="bg-gray-50 rounded-lg px-3 py-2.5 text-xs text-gray-500 leading-relaxed">
            ℹ 评估结果基于公开发布的岗位规则，各维度分数不对外显示。如对结果有异议，可在下方提交申诉。
          </div>

          {/* Appeal */}
          {!submitted ? (
            !appealOpen
              ? <button onClick={() => setAO(true)} className="w-full py-2.5 border border-gray-200 text-sm text-gray-600 rounded-xl hover:bg-gray-50 transition-colors">
                  我对结果有异议，申请复核 →
                </button>
              : <div className="space-y-2 fade-in">
                  <p className="text-xs font-medium text-gray-700">申诉说明</p>
                  <p className="text-xs text-gray-400">请说明异议理由，申诉将在 5 个工作日内处理。</p>
                  <textarea rows={3} value={appealText} onChange={e => setAT(e.target.value)}
                    placeholder="请描述您认为评估不准确的具体原因…"
                    className="w-full border border-gray-200 rounded-lg p-3 text-sm text-gray-700 resize-none focus:outline-none focus:ring-2 focus:ring-blue-300" />
                  <div className="flex gap-2">
                    <button onClick={() => setAO(false)} className="flex-1 py-2 border border-gray-200 text-sm text-gray-600 rounded-lg hover:bg-gray-50">取消</button>
                    <button disabled={!appealText.trim()} onClick={() => setSubmit(true)}
                      className="flex-1 py-2 bg-blue-600 text-white text-sm rounded-lg disabled:opacity-40 hover:bg-blue-700">提交申诉</button>
                  </div>
                </div>
          ) : (
            <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3 text-sm text-emerald-700 flex items-center gap-2 fade-in">
              <svg className="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7"/></svg>
              申诉已提交，预计 5 个工作日内处理完毕。
            </div>
          )}
        </div>
      </div>

      {/* Contrast callouts */}
      {["A","B","D","E","F","G","I"].includes(sel) && (
        <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-xs text-blue-800 leading-relaxed space-y-1 fade-in">
          <p className="font-semibold">💡 演示说明</p>
          {sel === "A" && <p>王芳来自复旦（985），有主导项目和数据分析经验，强推进面试。说明系统对强 985 候选人同样公平。</p>}
          {sel === "B" && <p>陈志远来自深圳大学（双非），凭项目主导经验得分与复旦王芳相当，同样强推进。核心对比：双非 ≠ 低能力。</p>}
          {sel === "D" && <p>李思琪来自浙大（985），但无产品主导经历，按规则不推进。印证系统不因学历放行，985 也要凭实力。</p>}
          {sel === "E" && <p>刘晓晨来自广东工业大学（双非），项目和技能均不达标，同样不推进。印证系统不因双非而降低标准。</p>}
          {sel === "F" && <p>吴佳琪来自杭州电子科技大学（双非），有完整后端项目和开源贡献，技术与算法维度得分高，强推进。</p>}
          {sel === "G" && <p>赵明远来自南京大学（985），四项维度均衡优秀，技术与项目经验充分，强推进面试。</p>}
          {sel === "I" && <p>周晓敏来自西安交通大学（985），缺乏后端工程经验，算法竞赛背景与岗位不匹配，按规则不推进。</p>}
        </div>
      )}
    </div>
  );
}

// ─── Page 4: Pool View ───────────────────────────────────────────────────────

function PoolView({ pool, removeFromPool }) {
  if (pool.length === 0) {
    return (
      <div className="max-w-lg mx-auto space-y-5 fade-in">
        <div>
          <h2 className="text-xl font-bold text-gray-800">简历备选池</h2>
          <p className="text-sm text-gray-500 mt-1">跨岗位备选简历，供其他 HR 参考复用</p>
        </div>
        <div className="bg-white rounded-xl border border-gray-200 p-8 text-center text-gray-400 text-sm">
          备选池暂无简历。在筛选工作台对「不推进」候选人点击「加入备选池」即可加入。
        </div>
      </div>
    );
  }

  return (
    <div className="max-w-lg mx-auto space-y-5 fade-in">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-xl font-bold text-gray-800">简历备选池</h2>
          <p className="text-sm text-gray-500 mt-1">跨岗位备选简历，供其他 HR 参考复用</p>
        </div>
        <span className="text-sm font-semibold text-amber-600 bg-amber-50 border border-amber-200 px-3 py-1 rounded-full">{pool.length} 份</span>
      </div>

      <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-xs text-amber-800 leading-relaxed">
        💡 这些候选人虽未通过本岗位筛选，但可能匹配其他部门需求。各岗位 HR 可在此浏览并联系感兴趣的候选人。
      </div>

      <div className="space-y-3">
        {pool.map(p => {
          const candidate = CANDIDATES.find(c => c.id === p.id);
          return (
            <div key={p.id} className="bg-white rounded-xl border border-gray-200 p-4 flex items-start justify-between gap-4 fade-in">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="font-bold text-gray-900">{p.name}</span>
                  <span className="text-xs bg-white border border-gray-200 text-gray-600 px-2 py-0.5 rounded-full">{p.school}</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full ${TAG_STYLE[p.tag]}`}>{p.tag}</span>
                </div>
                <p className="text-xs text-gray-500 mt-1 leading-relaxed">{candidate?.summary}</p>
                <div className="mt-1.5 flex items-center gap-1.5">
                  <span className="text-xs text-gray-400">来源岗位：</span>
                  <span className="text-xs text-gray-600 font-medium">{p.fromJob}</span>
                  <span className="text-xs text-red-400 ml-1">· 未通过</span>
                </div>
              </div>
              <button onClick={() => removeFromPool(p.id)}
                className="text-xs text-gray-400 hover:text-red-500 transition-colors shrink-0 mt-0.5 px-2 py-1 rounded hover:bg-red-50">
                移出
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── App Shell ────────────────────────────────────────────────────────────────

const PAGES = [
  { id: "rule",      label: "规则构建"   },
  { id: "screen",    label: "筛选工作台" },
  { id: "candidate", label: "候选人视图" },
];

function buildPublicPageHTML(dims, fp, lockedAt) {
  const rows = dims.map(d => `
    <tr>
      <td style="padding:10px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;color:#111">${d.label}</td>
      <td style="padding:10px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;color:#555;text-align:right">${d.weight}%</td>
    </tr>`).join("");
  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>筛选规则公示页 · 智筛 AI</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fa;min-height:100vh;padding:40px 16px}
    .card{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden}
    .header{background:#111;color:#fff;padding:24px 28px}
    .header h1{font-size:18px;font-weight:700;margin-bottom:4px}
    .header p{font-size:12px;color:#9ca3af}
    .body{padding:24px 28px;display:flex;flex-direction:column;gap:20px}
    .fp-box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px}
    .fp-label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .fp-value{font-family:monospace;font-size:16px;color:#111;letter-spacing:.15em;font-weight:700}
    .fp-note{font-size:11px;color:#9ca3af;margin-top:6px}
    .section-label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
    table{width:100%;border-collapse:collapse;border:1px solid #f0f0f0;border-radius:8px;overflow:hidden}
    th{background:#f9fafb;padding:10px 16px;font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;text-align:left;font-weight:600}
    th:last-child{text-align:right}
    .badge{display:inline-block;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;border-radius:20px;font-size:11px;padding:3px 10px;font-weight:600}
    .readonly{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;font-size:12px;color:#92400e}
    .meta{font-size:12px;color:#9ca3af}
    .meta span{color:#374151;font-weight:500}
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>筛选规则公示页</h1>
      <p>某公司 · 产品经理实习生 · 2026届秋招 · 智筛 AI 提供技术支持</p>
    </div>
    <div class="body">
      <div class="fp-box">
        <div class="fp-label">规则指纹（Rule Hash）</div>
        <div class="fp-value">${fp}</div>
        <div class="fp-note">候选人可将此指纹与投递确认邮件中的指纹对比，一致则表示规则未被修改。</div>
      </div>
      <div>
        <div class="section-label">评估维度与权重</div>
        <table>
          <thead><tr><th>维度</th><th>权重</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="meta">
        锁定时间：<span>${lockedAt}</span><br/>
        状态：<span class="badge">已锁定 · 不可修改</span>
      </div>
      <div class="readonly">
        ⚠ 本页面为只读公示，规则自锁定后不可更改。如对评估结果有异议，请通过候选人系统提交申诉。
      </div>
    </div>
  </div>
</body>
</html>`;
}

function App() {
  const [page, setPage]           = useState("rule");
  const [lockedDims, setLocked]   = useState(null);
  const [fingerprint, setFP]      = useState("");
  const [lockedAt, setLockedAt]   = useState("");
  const [selectedJob, setJob]     = useState(null);
  const [pool, setPool]           = useState([]); // [{id, name, school, tag, fromJob}]
  const [overrides, setOverrides] = useState({}); // {candidateId: "强推进面试"|"待定"|"不推进"}

  const [showRulesModal, setShowRulesModal] = useState(false);
  function openPublicPage() { if (lockedDims) setShowRulesModal(true); }

  function addToPool(candidate) {
    if (pool.find(p => p.id === candidate.id)) return;
    setPool(prev => [...prev, {
      id: candidate.id, name: candidate.name,
      school: candidate.school, tag: candidate.tag,
      fromJob: selectedJob ? JOB_PRESETS[selectedJob].label : "未知岗位",
    }]);
  }

  function removeFromPool(id) {
    setPool(prev => prev.filter(p => p.id !== id));
  }

  return (
    <div className="min-h-screen bg-gray-50">
      {showRulesModal && <RulesModal dims={lockedDims} fingerprint={fingerprint} lockedAt={lockedAt} selectedJob={selectedJob} onClose={() => setShowRulesModal(false)} />}
      {/* Nav */}
      <header className="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="w-7 h-7 bg-gray-900 rounded-lg flex items-center justify-center">
              <span className="text-white text-xs font-bold">智</span>
            </div>
            <span className="font-bold text-gray-900 text-sm">智筛 AI</span>
            <span className="text-xs text-gray-400 hidden sm:inline">· 可信简历筛选系统</span>
          </div>
          <div className="flex items-center gap-2">
            {lockedDims && (
              <span className="text-xs bg-gray-900 text-white px-2.5 py-1 rounded-full flex items-center gap-1">
                <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m0 0v2m0-2h2m-2 0H10M17 9a5 5 0 00-10 0"/></svg>
                {selectedJob ? JOB_PRESETS[selectedJob].label : "自定义岗位"} · 规则已锁定
              </span>
            )}
            {pool.length > 0 && (
              <button onClick={() => setPage("pool")}
                className="text-xs bg-amber-500 text-white px-2.5 py-1 rounded-full flex items-center gap-1 hover:bg-amber-600 transition-colors">
                <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8"/></svg>
                备选池 {pool.length}
              </button>
            )}
          </div>
        </div>
        <div className="max-w-3xl mx-auto px-4 flex gap-0">
          {PAGES.map(p => (
            <button key={p.id} onClick={() => setPage(p.id)}
              className={`px-4 py-2.5 text-xs font-medium border-b-2 transition-colors ${page === p.id ? "border-blue-500 text-blue-600" : "border-transparent text-gray-500 hover:text-gray-700"}`}>
              {p.label}
            </button>
          ))}
        </div>
      </header>

      <main className="max-w-3xl mx-auto px-4 py-8">
        {page === "rule"      && <RuleBuilder onLock={(d, fp, at, job) => { setLocked(d); setFP(fp); setLockedAt(at); setJob(job); }} openPublicPage={openPublicPage} onGoToScreen={() => setPage("screen")} onReset={() => { setLocked(null); setFP(""); setLockedAt(""); setJob(null); setOverrides({}); }} />}
        {page === "screen"    && <ScreeningDashboard dims={lockedDims} selectedJob={selectedJob} pool={pool} addToPool={addToPool} overrides={overrides} setOverrides={setOverrides} />}
        {page === "candidate" && <CandidateView dims={lockedDims} fingerprint={fingerprint} openPublicPage={openPublicPage} overrides={overrides} />}
        {page === "pool"      && <PoolView pool={pool} removeFromPool={removeFromPool} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
